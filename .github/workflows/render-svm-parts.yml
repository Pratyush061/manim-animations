name: Render SVM Parts

on:
  push:
    branches: [main]
    paths:
      - 'svm/part-*.py'
      - 'svm/svm_common.py'
  workflow_dispatch:  # manual trigger; choose which parts to render
    inputs:
      parts:
        description: 'Space-separated part numbers to render (e.g. "3 4")'
        required: false
        default: '1 2 3 4'

permissions:
  contents: write  # needed to commit the rendered videos back into the repo

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential python3-dev pkg-config \
            libcairo2-dev libpango1.0-dev \
            ffmpeg dvisvgm \
            texlive-latex-base texlive-latex-recommended texlive-latex-extra \
            texlive-fonts-recommended texlive-science

      - name: Install Manim
        run: |
          python -m pip install --upgrade pip
          pip install manim==0.22.0
          manim --version

      - name: Render and stitch the selected parts
        working-directory: svm
        env:
          # Dispatch input wins; a plain push renders parts 1-4 by default.
          PARTS: ${{ github.event.inputs.parts || '1 2 3 4' }}
        run: |
          set -euo pipefail

          render_part () {           # $1 = output name, $2 = file, $3 = scene list
            out="$1"; file="$2"; scenes="$3"
            for s in $scenes; do
              echo "::group::$out — $s"
              manim -qm --disable_caching --media_dir media "$file" "$s"
              echo "::endgroup::"
            done
            mkdir -p "concat/$out"; : > "concat/$out/list.txt"
            for s in $scenes; do
              f="$(find media/videos -type f -name "${s}.mp4" | head -n1)"
              if [ -z "$f" ]; then echo "MISSING render for $s"; exit 1; fi
              echo "file '$PWD/$f'" >> "concat/$out/list.txt"
            done
            ffmpeg -y -f concat -safe 0 -i "concat/$out/list.txt" -c copy "concat/$out/raw.mp4"
            DUR="$(ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 "concat/$out/raw.mp4")"
            # Bound the bitrate so the committed file stays well under GitHub's 100 MB limit.
            VBIT="$(python3 -c "d=float('$DUR'); print(max(250000, int((60*8*1024*1024)/d)))")"
            mkdir -p ../rendered
            ffmpeg -y -i "concat/$out/raw.mp4" -an \
              -c:v libx264 -preset slow -b:v "$VBIT" -maxrate "$VBIT" -bufsize "$((VBIT*2))" \
              -pix_fmt yuv420p -movflags +faststart "../rendered/$out.mp4"
            ls -lh "../rendered/$out.mp4"
          }

          echo "Rendering parts: $PARTS"
          for p in $PARTS; do
            case "$p" in
              1) render_part svm-part-01 part-01-hook.py       "S01_Hook S02_ManyLines" ;;
              2) render_part svm-part-02 part-02-margin.py     "S03_NarrowVsWide S04_TheStreet S05_SupportVectors" ;;
              3) render_part svm-part-03 part-03-math.py       "S06_Hyperplane S07_Margin S08_Optimization" ;;
              4) render_part svm-part-04 part-04-soft-margin.py "S09_WhyWideMargin S10_SoftMargin" ;;
              5) render_part svm-part-05 part-05-kernels.py    "S11_TheWall S12_TheLift S13_KernelTrick S14_KernelMenu" ;;
              6) render_part svm-part-06 part-06-recap.py      "S15_Recap" ;;
              *) echo "unknown part: $p"; exit 1 ;;
            esac
          done

      - name: Upload artifacts (backup copies)
        uses: actions/upload-artifact@v4
        with:
          name: svm-parts
          path: rendered/svm-part-*.mp4
          if-no-files-found: error

      - name: Commit the rendered videos into the repo
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered/svm-part-*.mp4
          if git diff --cached --quiet; then
            echo "Videos unchanged; nothing to commit."
            exit 0
          fi
          git commit -m "Render SVM parts [skip ci]"
          for i in 1 2 3 4 5; do
            git pull --rebase --autostash origin main && git push && break
            echo "push retry $i"; sleep 5
          done
