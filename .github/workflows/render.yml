name: Render Manim Animation

on:
  push:
    branches: [main]
  workflow_dispatch:  # allow manual triggers from the Actions tab

permissions:
  contents: write  # needed to commit the rendered video back into the repo

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Render Manim video
        uses: MengAiDev/manim_workflow@v1.0.0
        with:
          file: 'scene.py'
          scene: 'MyScene'
          quality: '-qm'
          output_dir: 'media/videos'
          python-version: '3.11'

      - name: Commit the rendered video into the repo
        run: |
          set -e
          mkdir -p rendered
          SRC=$(find media/videos -type f -name '*.mp4' -not -path '*partial_movie_files*' | head -n 1)
          echo "Using $SRC"
          cp "$SRC" rendered/MyScene.mp4
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add rendered/MyScene.mp4
          if git diff --cached --quiet; then
            echo "Video unchanged; nothing to commit."
          else
            git commit -m "Render MyScene [skip ci]"
            git push
          fi
